name: Implantação da Aplicação

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: dialogos-ec2
    steps:
      - uses: actions/checkout@v3

      - name: Configurando Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Configurando Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Instalando dependências
        run: npm ci --legacy-peer-deps

      - name: Criando arquivo .env
        run: |
          echo "${{ secrets.ENV_CONTENT }}" > .env.local

      - name: Compilando aplicação
        run: |
          set -a
          source .env.local
          set +a
          npm run build

      - name: Preparando diretório de build
        run: |
          BASE_DIR="/home/${USER}/dialogos-cliente"
          BUILD_DIR="${BASE_DIR}/builds/$(date +%Y%m%d_%H%M%S)"
          CURRENT_LINK="${BASE_DIR}/current"

          mkdir -p ${BUILD_DIR}

          cp -r .next/standalone/* ${BUILD_DIR}/
          cp -r .next/standalone/.next ${BUILD_DIR}/
          cp -r .next/static ${BUILD_DIR}/.next/
          cp -r public ${BUILD_DIR}/
          cp package.json ${BUILD_DIR}/
          cp .env.local ${BUILD_DIR}/.env.local

          ln -sfn ${BUILD_DIR} ${CURRENT_LINK}

      - name: Reiniciando aplicação no PM2
        run: |
          cd /home/${USER}/dialogos-cliente/current
          pm2 delete dialogos-client 2>/dev/null || true
          pm2 start ecosystem.config.cjs --only dialogos-client
          pm2 save

      - name: Limpando builds antigos
        run: |
          find /home/${USER}/dialogos-cliente/builds/ -maxdepth 1 -type d -mtime +7 -exec rm -rf {} \;
